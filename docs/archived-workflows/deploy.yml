name: Deploy Django to AWS Elastic Beanstalk
# 1. Triggers deployment on a `push` to the `main` branch.
# 2. Sets up a Python environment and installs dependencies from `requirements.txt`.
# 3. Creates a zip file of the project directory, excluding unnecessary files like `.git` and local environments.
# 4. Uses the `beanstalk-deploy` action to deploy the application to AWS Elastic Beanstalk, ensuring scalable and reliable hosting.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create deployment zip
      run: |
        zip -r project.zip . -x "*.git*" "*/venv/*" "*.github*" "*.DS_Store*" "*.sqlite3" "*.env"

    - name: Deploy to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v21
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
        application_name: X23328231
        environment_name: X23328231-env
        version_label: deploy-${{ github.run_id }}-${{ github.run_number }}-${{ github.sha }}
        region: eu-west-1
        deployment_package: project.zip
        use_existing_version_if_available: true
